<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0E1A40" />
    <link rel="icon" type="image/png" href="./assets/app-icon.png" />
    <title>Crust Quest</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0E1A40; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Keep the game clear of the notch and rounded corners on iPhones held sideways. */
      #game { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0E1A40; color: #fff; font-family: Fredoka, system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px; box-sizing: border-box; }
      #rotate .phone { width: 56px; height: 96px; border: 5px solid #8EC5FF; border-radius: 12px; animation: turn 1.6s ease-in-out infinite; }
      #rotate p { font-size: 22px; margin: 0; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
    <script type="module" crossorigin src="./assets/index-rU2bgrh4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BGOSjgAC.css">
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><p>Turn your phone sideways to play</p></div>
  </body>
